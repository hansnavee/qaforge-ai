# Config path for API service: hosting/railway.api.toml
# Service must have GitHub source connected to branch `master`.
# (CLI-only `railway up` uploads do NOT auto-deploy later GitHub pushes.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/api.Dockerfile"
# Repo-root anchored watch paths (Railway evaluates from /)
watchPatterns = [
  "/apps/api/**",
  "/packages/shared/**",
  "/packages/database/**",
  "/packages/agent-sdk/**",
  "/packages/browser-session/**",
  "/packages/report-engine/**",
  "/docker/api.Dockerfile",
  "/docker/api-entrypoint.sh",
  "/hosting/railway.api.toml",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml"
]

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
