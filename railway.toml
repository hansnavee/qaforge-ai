# Copy this file to the repo root as railway.toml when linking the API service,
# OR set Dockerfile path in the Railway UI to: docker/api.Dockerfile
#
# Prefer using deploy/railway.api.toml as the source of truth.

[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/api.Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
