name: Docker Stack

# Run the full QAForge stack in GitHub-hosted Docker (no local Docker required).
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-stack.yml"
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-stack.yml"

concurrency:
  group: docker-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Build & smoke-test Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BETTER_AUTH_SECRET: ci-secret-change-me-in-production-32chars
      BETTER_AUTH_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for API health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health; then
              echo ""
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 5
          done
          echo "API did not become healthy"
          docker compose ps
          docker compose logs --no-color --tail=200 api
          exit 1

      - name: Wait for Web
        run: |
          set -e
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -E '200|307|308'; then
              echo "Web is up"
              exit 0
            fi
            echo "Waiting for Web... ($i/40)"
            sleep 5
          done
          docker compose logs --no-color --tail=200 web
          exit 1

      - name: Smoke checks
        run: |
          set -e
          echo "== API health =="
          curl -fsS http://localhost:4000/api/v1/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          echo "== Auth endpoint reachable =="
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/api/auth/ok || true)
          echo "auth status: ${code:-n/a}"

          echo "== Web homepage =="
          curl -fsS -o /tmp/web.html http://localhost:3000
          grep -qi "QAForge" /tmp/web.html

          echo "== Worker running =="
          docker compose ps worker | grep -E 'running|Up'

          echo "Smoke checks passed"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
