name: Deploy Railway

# Deploys API/worker via Railway CLI.
# Requires repo secret: RAILWAY_TOKEN = Project Token from
# Railway → Project → Settings → Tokens (scoped to production).
# Project tokens already bind project+environment — do not use Account Tokens here.

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'docker/api.Dockerfile'
      - 'docker/worker.Dockerfile'
      - 'docker/api-entrypoint.sh'
      - 'hosting/railway.api.toml'
      - 'hosting/railway.worker.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: both
        type: choice
        options: [api, worker, both]

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-api:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'api' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing."
            echo "Create a Project Token in Railway → Project → Settings → Tokens"
            echo "(environment: production), then: gh secret set RAILWAY_TOKEN"
            exit 1
          fi
          # Project token is already scoped to project + environment.
          railway up \
            --service api \
            --ci \
            --detach \
            --yes \
            --message "GHA api ${GITHUB_SHA::7}"

  deploy-worker:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'worker' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | \
              grep -E '^(apps/worker/|packages/|docker/worker\.Dockerfile|hosting/railway\.worker\.toml|package\.json|pnpm-lock\.yaml|\.github/workflows/deploy-railway\.yml)' >/dev/null; then
              echo "No worker-relevant changes; skipping worker deploy."
              exit 0
            fi
          fi
          railway up \
            --service worker \
            --ci \
            --detach \
            --yes \
            --message "GHA worker ${GITHUB_SHA::7}"
