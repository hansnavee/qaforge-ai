name: Deploy Railway

# Primary deploy path for API/worker.
# GitHub→Railway webhooks alone are unreliable after CLI `railway up` uploads.
# Requires repo secret: RAILWAY_TOKEN (Railway account token from
# https://railway.app/account/tokens — prefer a dedicated CI token).

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'docker/api.Dockerfile'
      - 'docker/worker.Dockerfile'
      - 'docker/api-entrypoint.sh'
      - 'hosting/railway.api.toml'
      - 'hosting/railway.worker.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: both
        type: choice
        options: [api, worker, both]

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: b16f09df-7481-49d2-add1-0fcd49a9cfe4
  RAILWAY_ENVIRONMENT: production
  RAILWAY_REPO: hansnavee/qaforge-ai
  RAILWAY_BRANCH: master

jobs:
  deploy-api:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'api' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing. Create a token at https://railway.app/account/tokens and add it as a GitHub Actions secret."
            exit 1
          fi
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service api \
            --ci \
            --detach \
            --yes \
            --message "GHA api ${GITHUB_SHA::7}"
          # Keep GitHub source connected so dashboard still shows repo deploys
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service api \
            --repo "$RAILWAY_REPO" \
            --branch "$RAILWAY_BRANCH" \
            --json

  deploy-worker:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'worker' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is missing."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | \
              grep -E '^(apps/worker/|packages/|docker/worker\.Dockerfile|hosting/railway\.worker\.toml|package\.json|pnpm-lock\.yaml)' >/dev/null; then
              echo "No worker-relevant changes; skipping worker deploy."
              exit 0
            fi
          fi
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service worker \
            --ci \
            --detach \
            --yes \
            --message "GHA worker ${GITHUB_SHA::7}"
          railway service source connect \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service worker \
            --repo "$RAILWAY_REPO" \
            --branch "$RAILWAY_BRANCH" \
            --json
