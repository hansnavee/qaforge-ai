name: Deploy Railway

# Deploys API/worker via Railway CLI.
#
# Auth (set EXACTLY one):
#   RAILWAY_TOKEN     = Project Token
#                       Railway → your project → Settings → Tokens
#                       (pick environment: production)
#   RAILWAY_API_TOKEN = Account / Workspace Token
#                       https://railway.app/account/tokens
#
# Do not put an account token in RAILWAY_TOKEN (CLI returns Not signed in / Unauthorized).

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/**'
      - 'docker/api.Dockerfile'
      - 'docker/worker.Dockerfile'
      - 'docker/api-entrypoint.sh'
      - 'hosting/railway.api.toml'
      - 'hosting/railway.worker.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: both
        type: choice
        options: [api, worker, both]

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: b16f09df-7481-49d2-add1-0fcd49a9cfe4
  RAILWAY_ENVIRONMENT: production

jobs:
  deploy-api:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'api' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub injects missing secrets as ""; CLI treats that as "both set".
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then unset RAILWAY_API_TOKEN; fi
          if [ -z "${RAILWAY_TOKEN:-}" ]; then unset RAILWAY_TOKEN; fi
          if [ -n "${RAILWAY_API_TOKEN:-}" ] && [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::Both tokens set; using RAILWAY_API_TOKEN only."
            unset RAILWAY_TOKEN
          fi
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Using account token (RAILWAY_API_TOKEN), length=${#RAILWAY_API_TOKEN}"
            railway whoami || true
            railway up \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service api \
              --ci \
              --detach \
              --yes \
              --message "GHA api ${GITHUB_SHA::7}"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "Using project token (RAILWAY_TOKEN), length=${#RAILWAY_TOKEN}"
            railway up \
              --service api \
              --ci \
              --detach \
              --yes \
              --message "GHA api ${GITHUB_SHA::7}"
          else
            echo "::error::Set RAILWAY_TOKEN (project) or RAILWAY_API_TOKEN (account)."
            exit 1
          fi

  deploy-worker:
    if: ${{ github.event_name == 'push' || github.event.inputs.service == 'worker' || github.event.inputs.service == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$BEFORE" "${{ github.sha }}" | \
                grep -E '^(apps/worker/|packages/|docker/worker\.Dockerfile|hosting/railway\.worker\.toml|package\.json|pnpm-lock\.yaml|\.github/workflows/deploy-railway\.yml)' >/dev/null; then
                echo "No worker-relevant changes; skipping worker deploy."
                exit 0
              fi
            fi
          fi
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then unset RAILWAY_API_TOKEN; fi
          if [ -z "${RAILWAY_TOKEN:-}" ]; then unset RAILWAY_TOKEN; fi
          if [ -n "${RAILWAY_API_TOKEN:-}" ] && [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "::warning::Both tokens set; using RAILWAY_API_TOKEN only."
            unset RAILWAY_TOKEN
          fi
          if [ -n "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Using account token (RAILWAY_API_TOKEN), length=${#RAILWAY_API_TOKEN}"
            railway whoami || true
            railway up \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service worker \
              --ci \
              --detach \
              --yes \
              --message "GHA worker ${GITHUB_SHA::7}"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "Using project token (RAILWAY_TOKEN), length=${#RAILWAY_TOKEN}"
            railway up \
              --service worker \
              --ci \
              --detach \
              --yes \
              --message "GHA worker ${GITHUB_SHA::7}"
          else
            echo "::error::Set RAILWAY_TOKEN (project) or RAILWAY_API_TOKEN (account)."
            exit 1
          fi
