[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/worker.Dockerfile"
watchPatterns = [
  "apps/worker/**",
  "packages/**",
  "docker/worker.Dockerfile",
  "package.json",
  "pnpm-lock.yaml"
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[variables]
NODE_ENV = "production"
BROWSER_HEADLESS = "true"
